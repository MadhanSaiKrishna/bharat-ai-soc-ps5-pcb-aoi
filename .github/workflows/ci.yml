name: CI Contract & Smoke Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema pyyaml numpy

      - name: Run Schema & Contract Smoke Tests
        run: |
          pytest tests/test_contract.py -v
